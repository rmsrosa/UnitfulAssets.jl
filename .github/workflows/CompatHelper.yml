name: CompatHelper

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/CompatHelper.jl@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}